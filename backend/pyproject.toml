[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retract-backend"
version = "0.1.0"
description = "Retract — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "redis>=5.0",
    # 2.14.0 fixes an uncaught RecursionError reachable from a crafted JWT header
    # (CVE-2026-102265) plus a batch of JWK/algorithm-confusion advisories in 2.13.0.
    # The floor is deliberate, not incidental: 2.13.0 is the vulnerable release.
    "pyjwt>=2.14",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "radon>=6.0",
    # >=1.179 because 1.178 pins `pyjwt~=2.13.0`, which holds the vulnerable release
    # below the floor set above; 1.179 moved to `pyjwt>=2.15`. semgrep is only ever
    # run as a subprocess here, so its Python pin matters solely for resolution.
    "semgrep>=1.179",
    "tree-sitter==0.24.0",
    "tree-sitter-python==0.23.6",
    "tree-sitter-javascript==0.23.1",
    "tree-sitter-typescript==0.23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-redis>=4.6",
    # Dependency vulnerability scanning, run in CI. It is what would have caught the
    # 14 advisories against the PyJWT this app's whole session is built on.
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 conflicts with FastAPI's Depends-in-defaults idiom.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
