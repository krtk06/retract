services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_intel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  api:
    build: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      AI_INTEL_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_intel
      AI_INTEL_REDIS_URL: redis://redis:6379/0
      AI_INTEL_DATA_DIR: /data
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - repo_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      AI_INTEL_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_intel
      AI_INTEL_REDIS_URL: redis://redis:6379/0
      AI_INTEL_DATA_DIR: /data
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info --concurrency=2
    volumes:
      - repo_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    build:
      context: ../agent
    env_file:
      - path: ../.env
        required: false
    environment:
      # Tools call the API with the shared service secret; the channel verifies
      # the browser's exchanged token with the same JWT secret the API signs.
      AI_INTEL_API_URL: http://api:8000
      AI_INTEL_AGENT_TOKEN: ${AI_INTEL_AGENT_TOKEN:?set AI_INTEL_AGENT_TOKEN}
      AI_INTEL_JWT_SECRET: ${AI_INTEL_JWT_SECRET:?set AI_INTEL_JWT_SECRET}
      AI_INTEL_LLM_PROVIDER: ${AI_INTEL_LLM_PROVIDER:-mock}
      AI_INTEL_MODEL: ${AI_INTEL_MODEL:-}
      PORT: "3000"
    command: npm run start
    depends_on:
      - api
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ../frontend
      target: dev
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_EVE_PROXY: http://agent:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
      - agent

  # Production topology (nginx bundle, healthchecks, internal-only API, durable
  # agent state) lives in docker-compose.prod.yml.

volumes:
  postgres_data:
  repo_data:
