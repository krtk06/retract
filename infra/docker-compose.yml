services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_intel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  retract-api:
    build: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      RETRACT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_intel
      RETRACT_REDIS_URL: redis://redis:6379/0
      RETRACT_DATA_DIR: /data
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - repo_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  retract-worker:
    build: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      RETRACT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_intel
      RETRACT_REDIS_URL: redis://redis:6379/0
      RETRACT_DATA_DIR: /data
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info --concurrency=2
    volumes:
      - repo_data:/data
    # api and worker share one image (`build: ../backend`), so without this the worker
    # inherits the API's HTTP healthcheck from backend/Dockerfile and can never pass
    # it: a Celery worker serves no HTTP. The probe asks the worker's control channel
    # instead. See docker-compose.prod.yml for the timing rationale — `inspect ping`
    # is only answered between tasks, so it must tolerate a multi-minute analysis.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:celery_app inspect ping -d \"celery@$$(hostname)\" -t 10 || exit 1"]
      interval: 60s
      timeout: 20s
      start_period: 120s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

# Beat exists only to run the reaper that fails analyses stranded by a killed tool,
  # a crashed worker, or a host restart. It shares the worker's image and broker but
  # sends nothing to the queue, so it cannot compete with analysis work.
  retract-beat:
    build: ../backend
    env_file:
      - path: ../.env
        required: false
    environment:
      RETRACT_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_intel
      RETRACT_REDIS_URL: redis://redis:6379/0
      RETRACT_DATA_DIR: /data
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=info
    volumes:
      - repo_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  retract-agent:
    build:
      context: ../agent
    env_file:
      - path: ../.env
        required: false
    environment:
      # Tools call the API with the shared service secret; the channel verifies
      # the browser's exchanged token with the same JWT secret the API signs.
      RETRACT_API_URL: http://retract-api:8000
      RETRACT_AGENT_TOKEN: ${RETRACT_AGENT_TOKEN:?set RETRACT_AGENT_TOKEN}
      RETRACT_JWT_SECRET: ${RETRACT_JWT_SECRET:?set RETRACT_JWT_SECRET}
      RETRACT_LLM_PROVIDER: ${RETRACT_LLM_PROVIDER:-mock}
      RETRACT_MODEL: ${RETRACT_MODEL:-}
      PORT: "3000"
    command: npm run start
    depends_on:
      - retract-api
    ports:
      - "3000:3000"

  retract-frontend:
    build:
      context: ../frontend
      target: dev
    environment:
      VITE_API_PROXY: http://retract-api:8000
      VITE_EVE_PROXY: http://retract-agent:3000
    ports:
      - "5173:5173"
    depends_on:
      - retract-api
      - retract-agent

  # Production topology (nginx bundle, healthchecks, internal-only API, durable
  # agent state) lives in docker-compose.prod.yml.

volumes:
  postgres_data:
  repo_data:
