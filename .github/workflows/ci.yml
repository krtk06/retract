name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Ruff
        run: |
          ruff check backend
          ruff format --check backend
      - name: Mypy
        run: cd backend && mypy
      - name: Pytest
        run: cd backend && python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # eve requires Node >= 24.
          node-version: "24"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        # The credential guard, as node:test units: a wrong provider credential is
        # silent until the first message, so what this pins is what startup refuses.
        run: npm test
      - name: Evals
        # The mock fixture model and the in-process fixture API make this
        # hermetic: no provider credentials, no database, no containers.
        run: npm run eval

  # The only place the container images are actually built and run. Everything
  # else in this workflow tests source; this job tests the deployment artifacts:
  # that the images build, that compose comes up healthy, and that the nginx
  # bundle proxies to the API and the agent correctly.
  #
  # Both of these have already caught real defects that source-level tests could
  # not: a healthcheck pointed at a route eve does not serve, and a frontend image
  # running a dev server.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static container config check
        # Catches a COPY of a path that does not exist, a CMD naming a missing npm
        # script, and compose build targets that are not real Dockerfile stages —
        # the failures that break a first `docker compose up`.
        run: bash scripts/verify-container-config.sh
      - name: Build images
        run: docker compose -f infra/docker-compose.prod.yml build
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          AI_INTEL_AGENT_TOKEN: ci-agent-token
          AI_INTEL_JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long
      - name: Start stack and wait for health
        # `--wait` gates on every service's healthcheck, which is what caught the
        # three healthcheck bugs found by running this locally (the agent probing an
        # authenticated route, and the Celery worker inheriting the API's HTTP probe).
        # Cold start is ~35s; the timeout is slack for a loaded runner.
        #
        # No LLM credential is set here, and none is needed: eve bakes the provider
        # and model into its build output (see the agent Dockerfile), so this build
        # runs with no AI_INTEL_* in the environment and resolves the gateway default
        # without a key. The credential guard only fires for a production start on a
        # host, where the runtime environment is the real one. This job asserts that
        # images build and services come up healthy; it makes no model call, so
        # answer quality stays with the eval suites.
        run: docker compose -f infra/docker-compose.prod.yml up -d --wait --wait-timeout 300
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          AI_INTEL_AGENT_TOKEN: ci-agent-token
          AI_INTEL_JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose.prod.yml ps -a
          docker compose -f infra/docker-compose.prod.yml logs --tail=80
      - name: Probe through the frontend
        # Proving the nginx layer: these paths are served by the bundle and proxied
        # to the API and the agent respectively.
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost/api/health
          echo
          # A 401 is the pass condition here, and it is the *informative* one: it
          # proves the request reached eve through nginx and that the channel refuses
          # anonymous callers. Asserting 200 would mean auth had been bypassed.
          # (Verified against a running stack: /eve/v1/info -> 401 bare, 200 with a
          # backend-minted HS256 token.)
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/eve/v1/info)
          if [ "$code" != "401" ]; then
            echo "expected 401 from /eve/v1/info, got $code"
            exit 1
          fi
          echo "agent reachable through nginx and rejecting anonymous callers (401)"
          echo "nginx bundle proxied /api and /eve"
      - name: Service auth fails closed
        run: |
          set -euo pipefail
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'X-Agent-Token: wrong' http://localhost/api/repos)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.prod.yml logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.prod.yml down -v
