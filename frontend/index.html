<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Retract analyzes a GitHub repository for quality, security, testing, and documentation health — then tracks the score as it changes."
    />
    <meta name="theme-color" content="#faf9f7" />
    <!-- nosemgrep: data: favicon is inline; there is no remote response to pin -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%231d1a16'/%3E%3Cpath d='M5 12.5h3l2-4.5 3 9 2-4.5h4' fill='none' stroke='%23faf9f7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>RETRACT</title>
    <script>
      // Apply the theme before first paint: the stored choice wins; otherwise
      // the system preference. Mirrors the default in lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("retract-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              !window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#131210" : "#faf9f7");
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
