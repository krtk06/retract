<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Retract analyzes a GitHub repository for quality, security, testing, and documentation health — then tracks the score as it changes."
    />
    <meta name="theme-color" content="#faf9f7" />
    <link rel="icon" href="/favicon.svg" integrity="sha256-uRgBrva9XDOAcYCmAV/S+7Q4r3K1/9JNiajmdpSYXo8=" />
    <title>RETRACT</title>
    <script>
      // Apply the theme before first paint: the stored choice wins; otherwise
      // the system preference. Mirrors the default in lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("retract-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              !window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#131210" : "#faf9f7");
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
