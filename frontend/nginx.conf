server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve `api` and `agent` instead of pinning their IPs at startup.
    # 127.0.0.11 is Docker's embedded DNS. With a literal hostname in proxy_pass,
    # nginx resolves once when the config loads and caches the address forever, so
    # any container recreation that changes the IP — a restart, a crash, a rolling
    # deploy — leaves nginx proxying to a dead address and returning 502 until
    # nginx is itself restarted. That was observed here: the api and agent were
    # recreated, and every request through the published port 502'd while both
    # containers were healthy and serving. Using variables forces a DNS lookup per
    # request instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The API and the eve agent are separate services; the browser only ever talks
    # to this origin, so the cookie session and the SSE stream stay same-origin.
    #
    # Note `$request_uri` in both proxy_pass lines: once the upstream is a variable,
    # nginx no longer infers the URI and would otherwise forward nothing useful. It
    # also preserves today's behaviour exactly — a literal `proxy_pass http://retract-api:8000`
    # forwards the original path unchanged, which is what the backend's /api/*
    # routes expect.
    location /api/ {
        set $api_upstream http://retract-api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only eve's HTTP API is proxied, scoped to /eve/v1 — the base path the eve
    # React SDK uses (verified in node_modules/eve/dist, and the only thing
    # frontend/src calls). A broader `/eve/` location suggests eve's standalone
    # client UI is reachable here; it is not, and cannot be: eve serves that UI
    # from its own `/`, which this config already gives to the React app. Naming
    # `/eve/v1` (no trailing slash) is deliberate, so it also matches the bare
    # `/eve/v1` the SDK requests.
    #
    # eve streams session events over fetch, so buffering must be off or replies
    # arrive in one lump when the turn settles.
    location /eve/v1 {
        set $eve_upstream http://retract-agent:3000;
        proxy_pass $eve_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves clients pointing at assets that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
